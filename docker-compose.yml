services:
  backend:
    build:
      context: ./backend
    container_name: internal_admin_crm_backend
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      PYTHONPATH: /app
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/sql:/app/sql

  postgres:
    image: postgres:16
    container_name: internal_admin_crm_postgres
    environment:
      POSTGRES_DB: internal_admin_crm
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: internal_admin_crm_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: